version: '3.9'

services:
  server:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "4001:4001"
    environment:
      - PORT=4000
      - WS_PORT=4001
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DB_PATH=/data/doomsdesk.db
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - server_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://server:4000
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-wss://your-domain.com/ws}
    depends_on:
      server:
        condition: service_healthy

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --lt-cred-mech
      --fingerprint
      --no-multicast-peers
      --no-cli
      --no-tlsv1
      --no-tlsv1_1
      --realm=${TURN_REALM:-doomsdesk.io}
      --user=${TURN_USER:-doomsdesk}:${TURN_PASSWORD:-changeme}
      --min-port=49152
      --max-port=65535

volumes:
  server_data:
